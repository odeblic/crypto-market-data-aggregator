syntax = "proto3";

package marketdata;

enum Side {
    ASK = 0;
    BID = 1;
}

message Update {
    string symbol = 1;
    double price = 2;
    double quantity = 3;
    Side side = 4;
}

message PriceLevel {
  double price = 1;
  double quantity = 2;
}

message Snapshot {
  string symbol = 1;
  repeated PriceLevel bids = 2;
  repeated PriceLevel asks = 3;
}

message Request {
    string symbol = 1;
    uint32 depth = 2;
}

service Provider {
  rpc StreamMarketDataSnapshots (Request) returns (stream Snapshot);
  rpc StreamMarketDataUpdates (Request) returns (stream Update);
}
